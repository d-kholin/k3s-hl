apiVersion: v1
kind: Service
metadata:
  name: bambuddy
  namespace: bambuddy
  labels:
    app: bambuddy
# Pangolin route: print.thegriffiths.ca -> bambuddy.bambuddy.svc:8000
spec:
  type: ClusterIP
  selector:
    app: bambuddy
    app.kubernetes.io/name: bambuddy
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
