# Default-deny ingress; only the Newt tunnel pods (and kubelet probes, which
# k3s's network-policy controller always permits) may reach Dawarich.
# Egress stays open (reverse geocoding calls the Photon host).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dawarich
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: dawarich
spec:
  podSelector:
    matchLabels:
      app: dawarich
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 3000
---
# Postgres accepts connections only from the Dawarich pods (web + sidekiq).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dawarich-to-postgres
  namespace: dawarich
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dawarich
      ports:
        - protocol: TCP
          port: 5432
---
# Redis accepts connections only from the Dawarich pods (web + sidekiq).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dawarich-to-redis
  namespace: dawarich
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dawarich
      ports:
        - protocol: TCP
          port: 6379
