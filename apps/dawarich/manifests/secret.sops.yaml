# Secrets for the dawarich and postgres deployments.
#
# POSTGRES_PASSWORD feeds both postgres itself and the app's
# DATABASE_PASSWORD.
# APPLICATION_HOSTS is the Rails host allowlist — tenant-identifying (public
# hostname), keep in sync with the Pangolin resource URL. Must also contain
# localhost (health probes) and the dawarich.dawarich service names —
# Pangolin's target health check sends the service DNS name as Host, and a
# 403 there makes Pangolin consider the target down.
