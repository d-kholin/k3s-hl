apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-pgdata-encrypted
  namespace: dawarich
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — the location
    # history database lives here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 10Gi
