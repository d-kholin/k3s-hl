apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-data-encrypted
  namespace: dawarich
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — uploaded
    # imports, exports and Active Storage files live here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 10Gi
