apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omnitools

resources:
  - namespace.yaml
  - nginx-config.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# Metadata-only labels (selectors are set explicitly in the manifests).
labels:
  - pairs:
      app.kubernetes.io/name: omnitools
    includeSelectors: false
