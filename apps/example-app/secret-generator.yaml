# KSOPS generator: decrypts example-secrets.sops.yaml at kustomize build / Argo CD sync.
# Requires the KSOPS plugin on the machine (or Argo CD repo-server) that runs kustomize.

apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  # Kustomize generators require a name
  name: example-app-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./example-secrets.sops.yaml
