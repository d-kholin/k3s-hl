apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garagedoor-data-encrypted
  namespace: garagedoor
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — resync/replication
    # history samples live here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 1Gi
