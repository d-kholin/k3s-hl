apiVersion: apps/v1
kind: Deployment
metadata:
  name: garagedoor
  namespace: garagedoor
  labels:
    app: garagedoor
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garagedoor
      app.kubernetes.io/name: garagedoor
  template:
    metadata:
      labels:
        app: garagedoor
        app.kubernetes.io/name: garagedoor
    spec:
      # Restricted PSA compliant. uid 1000 (not the image's system user) works
      # because every path the app writes is a mounted volume owned via
      # fsGroup: the history PVC at /data, Next.js's runtime cache and /tmp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garagedoor
          image: ghcr.io/d-kholin/garagedoor:1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: America/Edmonton
            # Garage admin API URL + bearer token. Both tenant-identifying
            # (tailnet hostname / credential), so they live in the SOPS secret.
            - name: GARAGE_ADMIN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: garagedoor-secrets
                  key: GARAGE_ADMIN_ENDPOINT
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garagedoor-secrets
                  key: GARAGE_ADMIN_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Resync/replication history samples (GARAGEDOOR_DATA_DIR defaults
            # to /data in the image).
            - name: data
              mountPath: /data
            # next start writes its runtime cache inside the app tree.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: garagedoor-data-encrypted
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
