# Secrets for the mealie and postgres deployments.
#
# POSTGRES_PASSWORD was generated fresh for the cluster — it does not need to
# match the old compose stack (Mealie's backup restore is app-level, not a raw
# pg_restore).
#
# Besides credentials, tenant-identifying config (BASE_URL, OIDC discovery
# URL / provider name, SMTP from-name) is kept in here too so the plain
# manifests stay tenant-neutral. Edit values with:
#   sops set apps/mealie/manifests/secret.sops.yaml \
#     '["stringData"]["<KEY>"]' '"<value>"'
#
# Argo decrypts this via KSOPS (generators in kustomization.yaml) using the
# age private key in Secret sops-age (argocd namespace).
