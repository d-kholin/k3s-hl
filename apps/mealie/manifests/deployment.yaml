apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app: mealie
        app.kubernetes.io/name: mealie
    spec:
      # Restricted PSA compliant. Mealie's entrypoint only needs root for its
      # PUID/PGID chown dance; started directly as the PUID user it skips that
      # and just runs the app, so PUID/PGID below must match runAsUser/Group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mealie
          # Deliberately pinned behind latest (v3.22.0) as a Renovate test.
          image: ghcr.io/mealie-recipes/mealie:v3.22.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Edmonton
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            # postgres:15 with no POSTGRES_DB defaults the database name to
            # the user name.
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_USER
              value: mealie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: POSTGRES_PASSWORD
            - name: MAX_WORKERS
              value: "1"
            - name: WEB_CONCURRENCY
              value: "1"
            # Matches the compose stack it was migrated from.
            - name: ALLOW_SIGNUP
              value: "true"
            # Used for share/notification links and OIDC callbacks — keep in
            # sync with the Pangolin resource URL and the redirect URIs
            # registered on the SSO client. Tenant-specific, so it lives in
            # the SOPS-encrypted mealie-secrets.
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: BASE_URL
            # OIDC login; discovery URL, provider name, and client id/secret
            # are tenant-specific and live in the SOPS-encrypted mealie-secrets.
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: OIDC_CONFIGURATION_URL
            - name: OIDC_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: OIDC_PROVIDER_NAME
            - name: OIDC_AUTO_REDIRECT
              value: "false"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: OIDC_CLIENT_SECRET
            # SMTP for invites and notifications; host, from address, and
            # credentials live in the SOPS-encrypted mealie-secrets.
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_AUTH_STRATEGY
              value: TLS
            - name: SMTP_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: SMTP_FROM_NAME
            - name: SMTP_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: SMTP_FROM_EMAIL
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: SMTP_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data-encrypted
        - name: tmp
          emptyDir: {}
