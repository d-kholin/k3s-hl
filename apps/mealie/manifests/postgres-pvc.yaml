apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-pgdata-encrypted
  namespace: mealie
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — the database
    # lives here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # Skip K8up's file backup — raw pgdata would be a torn copy. The nightly
    # pg_dump (see postgres-deployment.yaml) is the usable backup; weekly
    # Longhorn block backups cover whole-volume DR.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 5Gi
