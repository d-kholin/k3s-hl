# Default-deny ingress; only the Newt tunnel pods (and kubelet probes, which
# k3s's network-policy controller always permits) may reach Mealie.
# Egress stays open (recipe scraping needs outbound HTTP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: mealie
spec:
  podSelector:
    matchLabels:
      app: mealie
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 9000
