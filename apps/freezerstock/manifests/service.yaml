# Frontend service — the app's entry point (Newt/Pangolin targets this).
apiVersion: v1
kind: Service
metadata:
  name: freezerstock
  namespace: freezerstock
  labels:
    app: freezerstock-frontend
spec:
  type: ClusterIP
  selector:
    app: freezerstock-frontend
    app.kubernetes.io/name: freezerstock
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
