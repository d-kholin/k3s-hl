# Default-deny ingress; only the Newt tunnel pods may reach the frontend
# (kubelet probes are always permitted by k3s's network-policy controller),
# and only the frontend may reach the backend — every /api call goes through
# the frontend nginx proxy, and access control happens at the Pangolin layer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: freezerstock
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: freezerstock
spec:
  podSelector:
    matchLabels:
      app: freezerstock-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: freezerstock
spec:
  podSelector:
    matchLabels:
      app: freezerstock-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: freezerstock-frontend
      ports:
        - protocol: TCP
          port: 3001
