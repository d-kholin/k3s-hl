apiVersion: apps/v1
kind: Deployment
metadata:
  name: freezerstock-backend
  namespace: freezerstock
  labels:
    app: freezerstock-backend
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: freezerstock-backend
      app.kubernetes.io/name: freezerstock
  template:
    metadata:
      labels:
        app: freezerstock-backend
        app.kubernetes.io/name: freezerstock
    spec:
      # Restricted PSA compliant. The image ships no non-root user; uid 1000
      # works because the only path the app writes (SQLite db in /app/data)
      # is a mounted volume owned via fsGroup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/d-kholin/freezerstock-backend:v1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_PATH
              value: /app/data/freezerstock.db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freezerstock-data-encrypted
