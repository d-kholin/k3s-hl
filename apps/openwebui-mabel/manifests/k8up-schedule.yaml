apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: backup-pod
  namespace: openwebui-mabel
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: openwebui-mabel
spec:
  podConfigRef:
    name: backup-pod
  backend:
    s3:
      bucket: naku-k8up/openwebui-mabel
  backup:
    schedule: "59 */6 * * *"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  check:
    schedule: "@weekly-random"
  prune:
    schedule: "@weekly-random"
    retention:
      keepLast: 28
      keepDaily: 14
      keepWeekly: 5
      keepMonthly: 6
