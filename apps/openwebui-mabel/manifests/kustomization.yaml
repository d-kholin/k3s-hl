apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openwebui-mabel

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - k8up-schedule.yaml

generators:
  - ksops-generator.yaml

labels:
  - pairs:
      app.kubernetes.io/name: openwebui-mabel
    includeSelectors: false
