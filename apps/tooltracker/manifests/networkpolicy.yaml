# Default-deny ingress; only the Newt tunnel pods (and kubelet probes, which
# k3s's network-policy controller always permits) may reach ToolTracker.
# The app authenticates via OIDC itself, but nothing else should bypass the
# Pangolin layer in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tooltracker
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: tooltracker
spec:
  podSelector:
    matchLabels:
      app: tooltracker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 5000
