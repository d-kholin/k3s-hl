apiVersion: apps/v1
kind: Deployment
metadata:
  name: tooltracker
  namespace: tooltracker
  labels:
    app: tooltracker
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tooltracker
      app.kubernetes.io/name: tooltracker
  template:
    metadata:
      labels:
        app: tooltracker
        app.kubernetes.io/name: tooltracker
    spec:
      # Restricted PSA compliant. The image's entrypoint needs root (chown +
      # gosu drop to its appuser, uid 1000), so the container command below
      # bypasses it and runs gunicorn directly as uid 1000 — fsGroup owns the
      # data volume instead of the chown.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tooltracker
          image: ghcr.io/d-kholin/tooltracker:1.0.37
          imagePullPolicy: IfNotPresent
          # The image CMD verbatim (ENTRYPOINT bypass, see above).
          command:
            - gunicorn
            - --bind
            - 0.0.0.0:5000
            - --workers
            - "2"
            - --timeout
            - "60"
            - --preload
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
            - --log-level
            - info
            - app:app
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: FLASK_ENV
              value: production
            - name: FLASK_DEBUG
              value: "0"
            - name: TOOLTRACKER_DB
              value: /data/tooltracker.db
            - name: UPLOAD_FOLDER
              value: /data/images
            - name: APP_NAME
              value: Tool Tracker
            - name: OIDC_SCOPES
              value: openid profile email
            # Session key, OIDC client credentials, and the app/IdP URLs are
            # tenant-identifying — SOPS secret.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tooltracker-secrets
                  key: SECRET_KEY
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tooltracker-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tooltracker-secrets
                  key: OIDC_CLIENT_SECRET
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: tooltracker-secrets
                  key: APP_URL
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: tooltracker-secrets
                  key: OIDC_ISSUER
            - name: OIDC_DISCOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: tooltracker-secrets
                  key: OIDC_DISCOVERY_URL
            - name: OIDC_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: tooltracker-secrets
                  key: OIDC_REDIRECT_URI
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tooltracker-data-encrypted
        - name: tmp
          emptyDir: {}
