# Apache Tika — text extraction for office/eml documents. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: paperless
  labels:
    app: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      # Restricted PSA compliant; the image already runs as its own non-root
      # user (uid 35002), pinned here so admission can verify it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 35002
        runAsGroup: 35002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tika
          # Same version the compose host's :latest resolved to. Upstream
          # image: the ghcr.io/paperless-ngx/tika mirror 403s anonymous pulls
          # now (paperless-ngx switched its compose files to apache/tika too).
          image: docker.io/apache/tika:2.9.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: tika
              containerPort: 9998
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Extraction scratch space — writable despite the read-only root
            # filesystem.
            - name: tmp
              mountPath: /tmp
          # No curl/wget in the image — TCP probes only.
          readinessProbe:
            tcpSocket:
              port: tika
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: tika
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
