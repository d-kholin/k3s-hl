# Paperless-ngx webserver. The single container runs the whole app stack
# (gunicorn, celery worker/beat, consumer) under s6-overlay, matching the
# upstream compose file's "webserver" service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  labels:
    app: paperless
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
      app.kubernetes.io/name: paperless
  template:
    metadata:
      labels:
        app: paperless
        app.kubernetes.io/name: paperless
    spec:
      # The service is named "paperless", so Kubernetes would inject
      # PAPERLESS_PORT=tcp://<ip>:8000 — which paperless-ngx reads as its web
      # server port setting and crash-loops on.
      enableServiceLinks: false
      # Restricted PSA compliant. Paperless-ngx documents running the image
      # as an arbitrary non-root user: s6 skips its chown/setuid init steps
      # and USERMAP_UID/GID are ignored. uid 1000 matches the compose host's
      # USERMAP_UID, so migrated files keep working ownership.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # s6-overlay's preinit requires /run to be owned by the running uid,
        # but an emptyDir is root-owned and we can't chown as non-root. A
        # directory created *inside* the emptyDir by this init container is
        # owned by uid 1000; the main container mounts it at /run via subPath.
        - name: init-run
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.2
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /run-vol/run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: run
              mountPath: /run-vol
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PAPERLESS_REDIS
              value: redis://redis:6379
            # v3 no longer infers the engine from PAPERLESS_DBHOST; without
            # this it silently falls back to SQLite.
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: postgres
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: POSTGRES_PASSWORD
            # Django session/CSRF signing key — the compose host ran on the
            # image default; set a real one here (sessions reset once).
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SECRET_KEY
            # Public base URL — tenant-identifying, so it lives in the SOPS
            # secret. Keep in sync with the Pangolin resource URL.
            - name: PAPERLESS_URL
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_URL
            # OIDC SSO via allauth — contains the IdP hostname and client
            # secret, so the whole JSON blob lives in the SOPS secret.
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            - name: PAPERLESS_TIKA_ENABLED
              value: "true"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://tika:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://gotenberg:3000
            - name: PAPERLESS_OCR_USER_ARGS
              value: '{"invalidate_digital_signatures": true}'
            - name: PAPERLESS_EMAIL_TASK_CRON
              value: "*/2 * * * *"
            # v3 accepts duplicate documents by default; restore the v2
            # reject-duplicates behavior.
            - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
              value: "true"
            # Reverse proxy IP trusted for client-IP headers (v3 allauth) —
            # internal topology, so it lives in the SOPS secret.
            - name: PAPERLESS_TRUSTED_PROXIES
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_TRUSTED_PROXIES
          securityContext:
            allowPrivilegeEscalation: false
            # Writable root filesystem is required: s6-overlay populates /run
            # at init and the app writes scratch files outside the mounted
            # dirs.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Search index + document classifier model.
            - name: data
              mountPath: /usr/src/paperless/data
              subPath: data
            # Document originals, archived PDFs, thumbnails.
            - name: data
              mountPath: /usr/src/paperless/media
              subPath: media
            # Drop-dir ingestion, polled by the consumer.
            - name: data
              mountPath: /usr/src/paperless/consume
              subPath: consume
            # document_exporter output (ad hoc / migration).
            - name: data
              mountPath: /usr/src/paperless/export
              subPath: export
            # OCR scratch space (ocrmypdf works under /tmp).
            - name: tmp
              mountPath: /tmp
            # uid-1000-owned dir prepared by the init container — s6-overlay
            # refuses to start if /run isn't owned by the running user.
            - name: run
              mountPath: /run
              subPath: run
          # Mirrors the compose healthcheck.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fs -S --max-time 2 http://localhost:8000
            # First boot runs migrations; the v2→v3 upgrade also recomputes
            # all document checksums (MD5→SHA256) and rebuilds the search
            # index (Whoosh→Tantivy), so allow up to 15 minutes.
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fs -S --max-time 2 http://localhost:8000
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fs -S --max-time 2 http://localhost:8000
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # OCR (ghostscript + tesseract) spikes on large scans — a tight
              # memory limit would OOM-kill mid-consume.
              cpu: 2000m
              memory: 3Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data-encrypted
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
