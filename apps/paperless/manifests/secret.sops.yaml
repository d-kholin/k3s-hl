# Secrets for the paperless and postgres deployments.
#
# POSTGRES_PASSWORD feeds both postgres itself and the app's PAPERLESS_DBPASS.
# PAPERLESS_SECRET_KEY is the Django session/CSRF signing key.
# PAPERLESS_URL is the public base URL — tenant-identifying, keep in sync with
# the Pangolin resource URL.
# PAPERLESS_SOCIALACCOUNT_PROVIDERS is the allauth OIDC config JSON — contains
# the IdP hostname and client secret.
