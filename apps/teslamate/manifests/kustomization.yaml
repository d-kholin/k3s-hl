apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teslamate

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - teslamateapi-deployment.yaml
  - teslamateapi-service.yaml
  - grafana-pvc.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - mosquitto-deployment.yaml
  - mosquitto-service.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - networkpolicy.yaml

generators:
  - ksops-generator.yaml

# Metadata-only labels (selectors are set explicitly in the manifests).
labels:
  - pairs:
      app.kubernetes.io/part-of: teslamate
    includeSelectors: false
