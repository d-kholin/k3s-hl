# TeslaMate's bundled Grafana image: upstream Grafana plus the TeslaMate
# dashboards and a Postgres datasource provisioned from the DATABASE_* env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: teslamate
  labels:
    app: grafana
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # Restricted PSA compliant. Upstream Grafana already runs as uid 472.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: teslamate/grafana:4.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: America/Edmonton
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_PASS
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_NAME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # Idles around 180Mi but spikes well past 512Mi rendering the
              # TeslaMate dashboards — 512Mi got it repeatedly OOMKilled.
              memory: 1.5Gi
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: teslamate-grafana-encrypted
        - name: tmp
          emptyDir: {}
