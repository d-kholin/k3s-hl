# Default-deny ingress; only the Newt tunnel pods (and kubelet probes, which
# k3s's network-policy controller always permits) may reach the web-facing
# pods. Egress stays open (TeslaMate polls the Tesla API outbound).
#
# TeslaMate's own UI has no authentication — keep Pangolin auth in front of
# whatever resource points at teslamate:4000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: teslamate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: teslamate
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - teslamate
          - grafana
          - teslamateapi
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
---
# Postgres accepts connections only from the pods that need the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-postgres
  namespace: teslamate
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - teslamate
                  - teslamateapi
                  - grafana
      ports:
        - protocol: TCP
          port: 5432
---
# Mosquitto accepts connections only from TeslaMate (publisher) and
# TeslaMateApi/hedgiemate-notifier (subscribers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-mosquitto
  namespace: teslamate
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - teslamate
                  - teslamateapi
                  - hedgiemate-notifier
      ports:
        - protocol: TCP
          port: 1883
