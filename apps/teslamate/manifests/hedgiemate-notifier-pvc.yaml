apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teslamate-hedgiemate-notifier-encrypted
  namespace: teslamate
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — notification
    # dedup/state lives here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 1Gi
