# Secrets shared by the teslamate, teslamateapi, grafana, postgres, and
# hedgiemate-notifier deployments.
#
# All values must carry over from the old compose stack's stack.env:
#   DATABASE_USER / DATABASE_PASS / DATABASE_NAME  <- TESLAMATE_DB_USER / _PASS / _NAME
#     (must match the old values so a pg_dump restore drops straight in)
#   ENCRYPTION_KEY      <- TESLAMATE_ENCRYPTION_KEY
#     (decrypts the Tesla API tokens stored in the database)
#   API_ENCRYPTION_KEY  <- TESLAMATE_API_KEY
#     (TeslaMateApi's copy of the same key; the compose stack fed it from a
#      separate variable, so it's kept separate here too)
#   HEDGIEMATE_USER_TOKEN / SERVER_ID
#     (HedgieMate account token and server identifier for hedgiemate-notifier)
#
# Edit values with:
#   sops set apps/teslamate/manifests/secret.sops.yaml \
#     '["stringData"]["<KEY>"]' '"<value>"'
#
# Argo decrypts this via KSOPS (generators in kustomization.yaml) using the
# age private key in Secret sops-age (argocd namespace).
apiVersion: v1
kind: Secret
metadata:
    name: teslamate-secrets
    namespace: teslamate
type: Opaque
