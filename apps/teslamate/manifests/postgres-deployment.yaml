apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: teslamate
  labels:
    app: postgres
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # K8up execs this on every backup run and stores stdout in the restic
        # repo as /teslamate-postgres.sql. Restore via `restic dump ... | psql`
        # — the Restore CRD can't restore stdin-based snapshots.
        # See docs/backups.md.
        k8up.io/backupcommand: sh -c 'PGDATABASE="$POSTGRES_DB" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" pg_dump --clean --if-exists'
        k8up.io/file-extension: .sql
    spec:
      # Restricted PSA compliant. The official postgres image normally starts
      # as root and drops to uid 999; starting directly as 999 skips the drop
      # and runs initdb/postgres as that user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Same major version as the compose stack (postgres:18-trixie) so a
          # dump/restore carries no version surprises.
          image: postgres:18-trixie
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_PASS
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_NAME
            # Subdirectory of the mount — initdb refuses a data dir that isn't
            # empty (the volume root holds lost+found / fsGroup metadata).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # Unix socket dir and scratch space — writable despite the
            # read-only root filesystem.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: teslamate-pgdata-encrypted
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
