apiVersion: apps/v1
kind: Deployment
metadata:
  name: teslamateapi
  namespace: teslamate
  labels:
    app: teslamateapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teslamateapi
  template:
    metadata:
      labels:
        app: teslamateapi
    spec:
      # Restricted PSA compliant — single static Go binary, no root needed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: teslamateapi
          image: tobiasehlert/teslamateapi:1.25.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: America/Edmonton
            # The compose stack fed this from TESLAMATE_API_KEY — carry that
            # value over. It must equal TeslaMate's ENCRYPTION_KEY for the API
            # to decrypt tokens when sending car commands.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: API_ENCRYPTION_KEY
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_PASS
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: teslamate-secrets
                  key: DATABASE_NAME
            - name: MQTT_HOST
              value: mosquitto
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
