apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teslamate-grafana-encrypted
  namespace: teslamate
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — Grafana users,
    # sessions, and dashboard customizations live here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 2Gi
