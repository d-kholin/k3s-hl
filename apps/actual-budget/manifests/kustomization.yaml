apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: actual-budget

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - k8up-schedule.yaml

# Metadata-only labels (selectors are set explicitly in the manifests —
# the deprecated commonLabels used to inject them, and selectors are immutable).
labels:
  - pairs:
      app.kubernetes.io/name: actual-budget
    includeSelectors: false
