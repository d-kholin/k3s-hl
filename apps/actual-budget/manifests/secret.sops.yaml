# OIDC settings for Actual Budget (all four are tenant-identifying or
# secret, so they live here rather than in deployment.yaml).
#
# ACTUAL_OPENID_DISCOVERY_URL    = the IdP's discovery document, e.g.
#                                  https://<idp host>/.well-known/openid-configuration
# ACTUAL_OPENID_CLIENT_ID /      = from the OIDC client registered on the IdP.
# ACTUAL_OPENID_CLIENT_SECRET      The client's callback URL must be
#                                  https://<actual public host>/openid/callback
# ACTUAL_OPENID_SERVER_HOSTNAME  = Actual's own public URL (the Pangolin
#                                  resource URL), e.g. https://<actual public host>
#
# Fill in the values, then encrypt in place before committing:
#   sops -e -i apps/actual-budget/manifests/secret.sops.yaml
