apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
  labels:
    app: actual-budget
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-budget
      app.kubernetes.io/name: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
        app.kubernetes.io/name: actual-budget
    spec:
      # Restricted PSA compliant. fsGroup 1001 (pre-existing) keeps /data files
      # from the root-era usable by uid 1001.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actual-server
          image: actualbudget/actual-server:26.9.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5006
              protocol: TCP
          env:
            - name: ACTUAL_PORT
              value: "5006"
            - name: ACTUAL_HOSTNAME
              value: "0.0.0.0"
            # OIDC login. Discovery URL, client id/secret and
            # Actual's public URL are tenant-identifying, so they live in the
            # SOPS-encrypted actual-budget-secrets. The client's callback URL
            # on the IdP must be https://<actual public host>/openid/callback
            - name: ACTUAL_OPENID_DISCOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: ACTUAL_OPENID_DISCOVERY_URL
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: ACTUAL_OPENID_CLIENT_ID
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: ACTUAL_OPENID_CLIENT_SECRET
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: ACTUAL_OPENID_SERVER_HOSTNAME
            # Keep password login available until SSO is confirmed working,
            # then flip to "true" to make OpenID the only login method.
            - name: ACTUAL_OPENID_ENFORCE
              value: "false"
            # Auto-provision an Actual account for anyone the IdP authenticates
            # (default "manual" would require pre-creating users in the admin UI)
            - name: ACTUAL_USER_CREATION_MODE
              value: "login"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data-encrypted
        - name: tmp
          emptyDir: {}
