apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-data
  namespace: actual-budget
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — data lives here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  # Uses cluster default StorageClass (Longhorn).
  resources:
    requests:
      storage: 5Gi
