apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Remote base: manifests live in the k8up-btl repo and arrive pinned to a
# release, so RBAC/env changes ship with every version bump. Renovate bumps
# both the ?ref= and the image tag (kustomize manager).
resources:
  - https://github.com/d-kholin/k8up-btl//deploy/k8s?ref=v1.17.1
  # Restore Lab scaffolding (docs/restore-lab.md in k8up-btl): restore-lab
  # namespace, destination-locked AppProject, default-deny ingress+egress
  # NetworkPolicies, and the lab's namespace-scoped RBAC.
  - https://github.com/d-kholin/k8up-btl//deploy/k8s/restore-lab?ref=v1.17.1
images:
  - name: ghcr.io/d-kholin/k8up-btl
    newTag: "1.17.1"
patches:
  # Enable the Restore Lab in the backend (empty = feature off).
  - target:
      kind: Deployment
      name: k8up-btl
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: k8up-btl
      spec:
        template:
          spec:
            containers:
              - name: btl
                env:
                  - name: RESTORE_LAB_NAMESPACE
                    value: restore-lab
