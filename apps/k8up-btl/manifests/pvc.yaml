# SQLite audit + durable restore job metadata.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8up-btl-data
  namespace: k8up-btl
  labels:
    app.kubernetes.io/name: k8up-btl
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
