apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-btl
  namespace: k8up-btl
  labels:
    app.kubernetes.io/name: k8up-btl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8up-btl
  labels:
    app.kubernetes.io/name: k8up-btl
rules:
  - apiGroups: ["k8up.io"]
    resources:
      - schedules
      - backups
      - restores
      - checks
      - prunes
      - snapshots
      - archives
      - prebackuppods
      - podconfigs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8up.io"]
    resources: ["restores", "backups", "checks"]
    verbs: ["create"]
  # Cancelling an in-flight GUI restore deletes its Restore CR, and aborting a
  # recovery deletes its unfinished safety Backup CR (both cascade to Jobs).
  - apiGroups: ["k8up.io"]
    resources: ["restores", "backups"]
    verbs: ["delete"]
  # SQL dump recovery pipes `restic dump` into the DB pod's git-declared
  # restore command (k8up-btl.local/restore-command annotation) via exec.
  # This is a real privilege: exec into any pod. Acceptable for a
  # single-operator tool behind SSO; see docs/deploy.md.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Pod -> Deployment owner resolution walks through the ReplicaSet; without
  # this, SQL recovery cannot identify (and exclude) the DB's own workload.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8up-btl
  labels:
    app.kubernetes.io/name: k8up-btl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8up-btl
subjects:
  - kind: ServiceAccount
    name: k8up-btl
    namespace: k8up-btl
