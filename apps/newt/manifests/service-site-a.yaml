# WireGuard endpoint for site A (Olm clients / ACCEPT_CLIENTS), same as the
# Service the Helm chart created.

apiVersion: v1
kind: Service
metadata:
  name: newt-site-a
  namespace: newt
  labels:
    app: newt-site-a
spec:
  type: ClusterIP
  selector:
    app: newt-site-a
    app.kubernetes.io/name: newt
  ports:
    - name: wg
      port: 51820
      targetPort: wg
      protocol: UDP
