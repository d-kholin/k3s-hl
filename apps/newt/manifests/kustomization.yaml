apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: newt

resources:
  - namespace.yaml
  - deployment-site-a.yaml
  - deployment-site-b.yaml
  - service-site-a.yaml
  - service-site-b.yaml

generators:
  - ksops-generator.yaml

# Keep the Pangolin LAN endpoint in one place. The patch adds the shared
# hostAliases entry to both Newt Deployments, then the replacement fills its IP
# from this generated ConfigMap.
configMapGenerator:
  - name: newt-shared-config
    literals:
      - PANGOLIN_LAN_IP=172.20.0.7
generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: newt-site-.*
    patch: |-
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: 0.0.0.0
            hostnames:
              - proxy.thegriffiths.ca

replacements:
  - source:
      kind: ConfigMap
      name: newt-shared-config
      fieldPath: data.PANGOLIN_LAN_IP
    targets:
      - select:
          group: apps
          version: v1
          kind: Deployment
          name: newt-site-.*
        fieldPaths:
          - spec.template.spec.hostAliases.0.ip

# Metadata-only labels (selectors are set explicitly in the manifests —
# the deprecated commonLabels used to inject them, and selectors are immutable).
labels:
  - pairs:
      app.kubernetes.io/name: newt
    includeSelectors: false
