apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: newt

resources:
  - namespace.yaml
  - deployment-site-a.yaml
  - deployment-site-b.yaml
  - service-site-a.yaml
  - service-site-b.yaml

generators:
  - ksops-generator.yaml

# Metadata-only labels (selectors are set explicitly in the manifests —
# the deprecated commonLabels used to inject them, and selectors are immutable).
labels:
  - pairs:
      app.kubernetes.io/name: newt
    includeSelectors: false
