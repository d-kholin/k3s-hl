# KSOPS generator: decrypts the *.sops.yaml secrets at kustomize build time
# (Argo CD). Requires KSOPS installed as a Kustomize plugin in Argo CD and age
# key available (Secret sops-age in argocd, or SOPS_AGE_KEY_FILE / env).

apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: newt-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret-site-a.sops.yaml
  - ./secret-site-b.sops.yaml
