apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-pgdata-encrypted
  namespace: linkwarden
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — the database
    # lives here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 5Gi
