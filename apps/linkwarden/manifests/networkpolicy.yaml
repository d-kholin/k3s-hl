# Default-deny ingress; only the Newt tunnel pods (and kubelet probes, which
# k3s's network-policy controller always permits) may reach Linkwarden.
# Egress stays open (page archiving needs outbound HTTP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: linkwarden
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: linkwarden
spec:
  podSelector:
    matchLabels:
      app: linkwarden
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 3000
---
# Postgres accepts connections only from the Linkwarden pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-linkwarden-to-postgres
  namespace: linkwarden
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: linkwarden
      ports:
        - protocol: TCP
          port: 5432
---
# Meilisearch accepts connections only from the Linkwarden pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-linkwarden-to-meilisearch
  namespace: linkwarden
spec:
  podSelector:
    matchLabels:
      app: meilisearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: linkwarden
      ports:
        - protocol: TCP
          port: 7700
