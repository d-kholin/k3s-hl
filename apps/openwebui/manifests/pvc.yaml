apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data-encrypted
  namespace: openwebui
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 10Gi
