# Default-deny ingress; only Newt (Pangolin tunnel) may reach the GUI.
# Auth is at Pangolin/Authentik — no in-app login.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: k8up-gui
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: k8up-gui
spec:
  podSelector:
    matchLabels:
      app: k8up-gui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 8080
