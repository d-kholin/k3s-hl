apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-gui
  namespace: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui
rules:
  - apiGroups: ["k8up.io"]
    resources:
      - schedules
      - backups
      - restores
      - checks
      - prunes
      - snapshots
      - archives
      - prebackuppods
      - podconfigs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8up.io"]
    resources: ["restores", "backups", "checks"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8up-gui
subjects:
  - kind: ServiceAccount
    name: k8up-gui
    namespace: k8up-gui
