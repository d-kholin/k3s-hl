apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: virtues-and-vices
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-newt-ingress
  namespace: virtues-and-vices
spec:
  podSelector:
    matchLabels:
      app: virtues-and-vices
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 5173
