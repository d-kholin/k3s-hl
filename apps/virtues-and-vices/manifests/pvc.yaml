apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: virtues-and-vices-data-encrypted
  namespace: virtues-and-vices
  annotations:
    # Never let Argo delete this PVC (prune or app deletion) — data lives here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 1Gi
