apiVersion: apps/v1
kind: Deployment
metadata:
  name: lubelogger
  namespace: lubelogger
  labels:
    app: lubelogger
spec:
  replicas: 1
  # RWO volume — avoid multi-attach by never rolling two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lubelogger
      app.kubernetes.io/name: lubelogger
  template:
    metadata:
      labels:
        app: lubelogger
        app.kubernetes.io/name: lubelogger
    spec:
      # Restricted PSA compliant. The image ships no non-root user; uid 1000
      # works because every path the app writes is a mounted volume owned via
      # fsGroup. HOME points at the keys mount so ASP.NET DataProtection keys
      # ($HOME/.aspnet/DataProtection-Keys) survive restarts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lubelogger
          image: ghcr.io/hargata/lubelogger:v1.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: America/Edmonton
            - name: HOME
              value: /keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /App/config
              subPath: config
            - name: data
              mountPath: /App/data
              subPath: data
            - name: data
              mountPath: /App/wwwroot/translations
              subPath: translations
            - name: data
              mountPath: /App/wwwroot/documents
              subPath: documents
            - name: data
              mountPath: /App/wwwroot/images
              subPath: images
            - name: data
              mountPath: /App/wwwroot/temp
              subPath: temp
            - name: data
              mountPath: /App/log
              subPath: log
            - name: data
              mountPath: /keys
              subPath: keys
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lubelogger-data-encrypted
        - name: tmp
          emptyDir: {}
