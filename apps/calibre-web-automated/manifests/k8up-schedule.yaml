# K8up backups for this namespace: a nightly restic backup of every PVC
# (Calibre library incl. metadata.db, app config incl. app.db, and the ingest
# folder) into the Garage bucket folder naku-k8up/calibre-web-automated — a
# standard restic repo, browsable/restorable from any tailnet machine.
# Endpoint, credentials, and repo password come from the operator globals
# (k8up-global secret in the k8up namespace) — nothing app-specific here.
# See docs/backups.md.
#
# Note: the SQLite stores (metadata.db, app.db) are backed up live.
# Point-in-time consistency is covered by Longhorn's 6-hourly snapshots and
# weekly block backups.

# Makes the k8up job pods restricted-PSA-shaped (they don't need root even in
# this baseline namespace) and runs them as the data volumes' owner so file
# backups can read them. K8up re-applies name/image/command after merging
# this template; env/args/mounts are set afterwards.
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: backup-pod
  namespace: calibre-web-automated
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: calibre-web-automated
spec:
  podConfigRef:
    name: backup-pod
  backend:
    s3:
      # Top-level folder in the shared bucket = this namespace's restic repo.
      bucket: naku-k8up/calibre-web-automated
  backup:
    # -random schedules are stable per Schedule and spread load across apps.
    schedule: "@daily-random"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  check:
    schedule: "@weekly-random"
  prune:
    schedule: "@weekly-random"
    retention:
      keepLast: 3
      keepDaily: 14
      keepWeekly: 5
      keepMonthly: 6
