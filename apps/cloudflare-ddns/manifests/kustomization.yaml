apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudflare-ddns

resources:
  - namespace.yaml
  - deployment.yaml
  - networkpolicy.yaml

generators:
  - ksops-generator.yaml

# Metadata-only labels (selectors are set explicitly in the manifests —
# the deprecated commonLabels used to inject them, and selectors are immutable).
labels:
  - pairs:
      app.kubernetes.io/name: cloudflare-ddns
    includeSelectors: false
