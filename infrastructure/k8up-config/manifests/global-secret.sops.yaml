# Global K8up backend credentials — referenced by k8up.envVars in
# infrastructure/k8up/values.yaml. One secret covers every namespace's
# Schedule: per-app Schedules only set s3.bucket (naku-k8up/<namespace>).
#
# Fill in real values with:
#   sops infrastructure/k8up-config/manifests/global-secret.sops.yaml
#
# BACKUP_GLOBALS3ENDPOINT = the Garage S3 endpoint URL
# BACKUP_GLOBALACCESSKEYID / BACKUP_GLOBALSECRETACCESSKEY = the naku-k8up
#   Garage key (created manually on the Garage host)
# BACKUP_GLOBALREPOPASSWORD = shared restic repository password for all
#   per-namespace repos. restic encrypts client-side with this — losing it
#   means losing every backup. Keep a copy wherever the offline age key lives.
