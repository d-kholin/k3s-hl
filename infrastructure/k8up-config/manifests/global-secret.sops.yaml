# Global K8up backend credentials — referenced by k8up.envVars in
# infrastructure/k8up/values.yaml. One secret covers every namespace's
# Schedule: per-app Schedules only set s3.bucket (k8up-k3s/<namespace>).
#
# Fill in real values with:
#   sops infrastructure/k8up-config/manifests/global-secret.sops.yaml
#
# BACKUP_GLOBALS3ENDPOINT = Backblaze B2 S3-compatible endpoint URL
#   (e.g. https://s3.us-east-005.backblazeb2.com)
# BACKUP_GLOBALACCESSKEYID / BACKUP_GLOBALSECRETACCESSKEY = B2 application
#   key id + key (scoped to the k8up-k3s bucket; master key will not work)
# BACKUP_GLOBALREPOPASSWORD = shared restic repository password for all
#   per-namespace repos. restic encrypts client-side with this — losing it
#   means losing every backup. Keep a copy with the offline age key.
#
apiVersion: v1
kind: Secret
metadata:
    name: k8up-global
    namespace: k8up
type: Opaque
stringData:
