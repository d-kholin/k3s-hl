# Chart defaults are correct: installCRDs true, single controller replica,
# validating webhook disabled (snapshot validation is CEL-based since
# external-snapshotter v8). ServiceMonitor left off — add via
# monitoring-config if Kasten survives the evaluation.
#
# VolumeSnapshotClasses are deliberately NOT set here — the Longhorn class
# lives in kasten-config with the rest of the Kasten evaluation config.
controller:
  replicaCount: 1
