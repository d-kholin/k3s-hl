# CSI external-snapshotter: VolumeSnapshot CRDs + snapshot-controller.
# k3s ships neither, and the Longhorn chart only ships the csi-snapshotter
# sidecar — without this, VolumeSnapshot objects are never reconciled.
# Generic storage plumbing kept for any future CSI snapshot consumer
# (originally added for the Kasten K10 evaluation, since removed).
#
# Wave 0: anything consuming VolumeSnapshots depends on the CRDs. The chart
# renders CRDs as normal templates (installCRDs default true), so Argo
# upgrades them like any resource.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://piraeus.io/helm-charts/
      chart: snapshot-controller
      targetRevision: 5.2.0
      helm:
        releaseName: snapshot-controller
        valueFiles:
          - $values/infrastructure/snapshot-controller/values.yaml
    - repoURL: https://github.com/d-kholin/k3s-hl.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
