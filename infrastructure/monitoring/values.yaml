# kube-prometheus-stack Helm values.
# Chart: https://prometheus-community.github.io/helm-charts (version pinned
# in application.yaml).

# k3s runs controller-manager/scheduler/proxy/etcd inside the k3s process
# without the standalone metrics endpoints these scrapers expect — disable
# them (and their rules) to avoid permanently-firing *Down alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    etcd: false

prometheus:
  prometheusSpec:
    # Alert emails' per-alert "Source" links point here (expose via Pangolin
    # with auth, or leave unexposed — the name is right either way).
    externalUrl: https://prometheus.k3s.thegriffiths.ca
    retention: 14d
    # Pick up ServiceMonitors/PodMonitors/PrometheusRules from any namespace
    # regardless of Helm-release labels (the Longhorn ones live in the
    # monitoring-config app).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    # Public URL used in email links ("View in Alertmanager") — served by a
    # Pangolin resource pointing at the alertmanager Service (keep Pangolin
    # auth ON: Alertmanager itself is unauthenticated and can silence alerts).
    externalUrl: https://alertmanager.k3s.thegriffiths.ca
    # Full Alertmanager config (SMTP host/credentials, email receiver) comes
    # from the SOPS-encrypted secret in monitoring-config — not chart values —
    # because this repo is public. Edit with:
    #   sops infrastructure/monitoring-config/manifests/alertmanager-config.sops.yaml
    configSecret: alertmanager-config
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

# Grafana stays ClusterIP; reach it with:
#   kubectl -n monitoring port-forward svc/monitoring-grafana 3000:80
# Admin credentials come from the SOPS grafana-admin secret (monitoring-config)
# — a fixed secret, or the chart regenerates a random password every render
# and Argo reports permanent drift.
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
