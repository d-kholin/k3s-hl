# Longhorn alerts: the failures that would otherwise stay silent until a
# disaster — degraded/faulted volumes, stale or missing backups, unready
# nodes, and disks filling up.
#
# longhorn_volume_robustness: 0=unknown 1=healthy 2=degraded 3=faulted
# longhorn_volume_last_backup_at: unix timestamp of last backup, 0 if never
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: monitoring
spec:
  groups:
    - name: longhorn
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is degraded
            description: >-
              Volume {{ $labels.volume }} has been running with fewer than its
              configured replica count for 15 minutes (node down or rebuild in
              progress).

        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is faulted
            description: >-
              Volume {{ $labels.volume }} has no usable replica left — data is
              unavailable until restored.

        - alert: LonghornVolumeBackupTooOld
          expr: >-
            (time() - longhorn_volume_last_backup_at > 26 * 3600)
            and (longhorn_volume_last_backup_at > 0)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Backup of {{ $labels.volume }} is older than 26h
            description: >-
              The daily 03:00 backup of volume {{ $labels.volume }} has not
              produced a new backup in over 26 hours — check the backup target
              (Garage over Tailscale) and the backup-daily RecurringJob.

        - alert: LonghornVolumeNeverBackedUp
          expr: longhorn_volume_last_backup_at == 0
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: Volume {{ $labels.volume }} has never been backed up
            description: >-
              Volume {{ $labels.volume }} existed through at least one daily
              backup window without a single backup reaching the target.

        - alert: LonghornNodeNotReady
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Longhorn node {{ $labels.node }} not ready
            description: >-
              Longhorn considers node {{ $labels.node }} unready — replicas on
              it are offline and volumes may be degraded.

        - alert: LonghornNodeStorageLow
          expr: >-
            longhorn_node_storage_usage_bytes
            / longhorn_node_storage_capacity_bytes > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Longhorn disk on {{ $labels.node }} over 85% full
            description: >-
              Storage usage on node {{ $labels.node }} is above 85% — replica
              scheduling will stop at the minimal-available threshold.
