# Scrape K8up operator metrics (per-namespace job counters and
# schedule-success gauges) via the k8up-metrics service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: k8up
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - k8up
  selector:
    matchLabels:
      app.kubernetes.io/name: k8up
      app.kubernetes.io/instance: k8up
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
