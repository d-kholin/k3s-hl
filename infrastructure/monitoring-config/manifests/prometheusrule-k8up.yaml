# K8up alerts: the restic file/dump backups silently failing or silently not
# running. Complements the Longhorn block-backup alerts.
#
# k8up_schedule_last_job_succeeded{namespace,schedule,jobType}: 1 if the most
# recent job triggered by the schedule succeeded, 0 if it failed.
#
# Staleness deliberately uses kube-state-metrics job data, NOT the
# k8up_jobs_*_counter series: those counters live in the operator's memory
# and reset to 0 whenever it restarts (e.g. lost leader election), which
# made increase()==0 false-fire. Job objects persist (history limit 2), so
# completion timestamps survive operator restarts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8up
  namespace: monitoring
spec:
  groups:
    - name: k8up
      rules:
        - alert: K8upLastJobFailed
          expr: k8up_schedule_last_job_succeeded == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              K8up {{ $labels.jobType }} in {{ $labels.namespace }} failed
            description: >-
              The most recent {{ $labels.jobType }} job of schedule
              {{ $labels.schedule }} in namespace {{ $labels.namespace }}
              failed — check `kubectl -n {{ $labels.namespace }} get jobs`
              and the job pod logs. Clears itself on the next successful run.

        - alert: K8upBackupStale
          # Namespaces that have k8up Schedules but no backup job completed
          # in 26h. The unless-join also keeps longhorn-system's unrelated
          # backup-daily/weekly jobs out (no Schedule there).
          expr: >-
            (k8up_schedules_gauge > 0)
            unless on (namespace)
            (
              time()
              - max by (namespace) (kube_job_status_completion_time{job_name=~"backup-.*"})
              < 26 * 3600
            )
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: No successful K8up backup in {{ $labels.namespace }} for >26h
            description: >-
              Namespace {{ $labels.namespace }} has no completed restic backup
              job in over 26 hours — the schedule may have stopped firing or
              every run is failing. (Expected on a brand-new namespace until
              its first nightly backup lands.)
