# Longhorn Helm values.
# Chart: https://charts.longhorn.io (version pinned in application.yaml)
#
# Default StorageClass with 3 replicas. Data path: /var/lib/longhorn on each node.

# Chart's plain "longhorn" class is NOT default — longhorn-encrypted
# (infrastructure/longhorn-config) is the cluster default so new PVCs are
# encrypted at rest and in backups.
persistence:
  defaultClass: false
  defaultFsType: ext4
  defaultClassReplicaCount: 3
  reclaimPolicy: Delete
  defaultDataLocality: disabled

defaultSettings:
  defaultReplicaCount: "3"
  defaultDataPath: /var/lib/longhorn
  # Allow scheduling on nodes that already have a replica (homelab-friendly)
  replicaSoftAntiAffinity: "true"
  storageMinimalAvailablePercentage: "10"
  storageOverProvisioningPercentage: "100"
  # On node death, force-delete pods using Longhorn volumes so RWO volumes can
  # detach and replacement pods on other nodes can attach (default: do-nothing).
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # After a chart upgrade, live-upgrade attached volumes' engines automatically
  # (required before the next minor upgrade; brief sub-second IO pause).
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"

# S3-compatible backup target (self-hosted Garage; bucket naku-longhorn must
# exist). The @region token must match Garage's s3_region ("garage" by
# default) — it goes into the AWS SigV4 signing scope. Trailing slash is
# mandatory. Credentials:
#   sops infrastructure/longhorn-config/manifests/backup-target-secret.sops.yaml
defaultBackupStore:
  backupTarget: s3://naku-longhorn@garage/
  backupTargetCredentialSecret: longhorn-backup-target
  pollInterval: 300

# Keep UI ClusterIP; expose later via Pangolin/Newt or Ingress if desired.
service:
  ui:
    type: ClusterIP
