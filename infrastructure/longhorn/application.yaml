# Longhorn distributed block storage (Helm).
# Default StorageClass; 3 replicas. Nodes need open-iscsi — see README.
#
# First install note: chart pre-upgrade Job is a PreSync hook that needs
# longhorn-service-account (Sync-phase). On a brand-new cluster, sync once with
# apply-only / skip-hooks, then normal syncs work.
#
# Drift ignored below:
# - longhorn-manager injects conversion webhooks on several CRDs
# - apiserver drops chart's preserveUnknownFields on apply → perpetual OOS

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      # Upgrade path: one minor at a time (1.8 -> 1.9 -> 1.10 -> 1.11 -> 1.12).
      targetRevision: 1.10.2
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/infrastructure/longhorn/values.yaml
    - repoURL: https://github.com/d-kholin/k3s-hl.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
        - .spec.preserveUnknownFields
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
