# K10 evaluation values. Basic-auth login (htpasswd in the k10-basic-auth
# secret from kasten-config); dashboard is exposed through Pangolin via the
# Newt tunnel (see kasten-config networkpolicy.yaml), path /k10/.
#
# PVCs are pinned to longhorn-encrypted (the current default StorageClass)
# so a future default-SC change can't move the catalog. Defaults request
# ~70Gi across catalog/jobs/logging/prometheus PVCs — Longhorn
# thin-provisions, so real usage stays small; shrink global.persistence.size
# only if over-provisioning alarms fire.
auth:
  basicAuth:
    enabled: true
    secretName: k10-basic-auth

global:
  persistence:
    storageClass: longhorn-encrypted
