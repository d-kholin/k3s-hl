# App-of-Apps: Argo CD Applications for cluster infrastructure.
# Applied by bootstrap/root-app.yaml (path: infrastructure).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd/application.yaml
  - snapshot-controller/application.yaml
  - longhorn/application.yaml
  - longhorn-config/application.yaml
  - coredns-custom/application.yaml
  - k8up/application.yaml
  - k8up-config/application.yaml
  # monitoring + monitoring-config disabled (resource weight); manifests kept
  # under infrastructure/monitoring{,-config}/ — re-add these two lines to restore.
