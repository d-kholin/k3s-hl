# KSOPS generator: decrypts *.sops.yaml secrets at kustomize build time (Argo CD).
# Same setup as k8up-config — requires KSOPS plugin + sops-age secret in argocd.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: kasten-config-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./garage-secret.sops.yaml
