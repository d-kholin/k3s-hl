# Reaper for K10's export-staging leftovers. Every export run K10 creates a
# temporary kanister-pvc-* clone in kasten-io and deletes the PVC when done —
# but longhorn-encrypted has reclaimPolicy Retain (deliberate, protects real
# app volumes), so each run strands a Released PV plus its 3-replica Longhorn
# volume. Left alone this re-exhausts Longhorn's scheduling budget within
# days. Hourly to match the most frequent backup policies.
#
# Scope is deliberately narrow: only PVs that are Released AND whose claim
# was kasten-io/kanister-pvc-* are touched — intentionally Retained volumes
# (app PVs, migration leftovers) never match.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanister-pv-reclaim
  namespace: kasten-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kanister-pv-reclaim
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, delete]
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kanister-pv-reclaim
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kanister-pv-reclaim
subjects:
  - kind: ServiceAccount
    name: kanister-pv-reclaim
    namespace: kasten-io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kanister-pv-reclaim
  namespace: kasten-io
spec:
  # :40 keeps clear of on-the-hour policy runs and the ~00:05 kube-04 reset.
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: kanister-pv-reclaim
          restartPolicy: Never
          containers:
            - name: reclaim
              # alpine/kubectl, not rancher/kubectl: the latter ships no
              # shell and this job is a shell script.
              image: docker.io/alpine/kubectl:1.36.3
              command:
                - /bin/sh
                - -ec
                - |
                  kubectl get pv -o go-template='{{range .items}}{{if eq .status.phase "Released"}}{{.metadata.name}} {{.spec.claimRef.namespace}} {{.spec.claimRef.name}}{{"\n"}}{{end}}{{end}}' |
                  while read -r pv ns claim; do
                    case "$ns/$claim" in
                      kasten-io/kanister-pvc-*)
                        echo "reclaiming $pv (was $ns/$claim)"
                        kubectl delete pv "$pv"
                        kubectl -n longhorn-system delete volumes.longhorn.io "$pv" --ignore-not-found
                        ;;
                    esac
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
