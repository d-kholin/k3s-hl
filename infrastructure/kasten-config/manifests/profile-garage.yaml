# K10 location Profile: the export target K10 backup policies reference.
# The endpoint hostname is plaintext by accepted exception (it already
# appears in the coredns-custom hosts pin); credentials live in
# garage-secret.sops.yaml. Reachable over the tailnet only — pods resolve
# it via the coredns-custom hosts entry, same as k8up and Longhorn.
# region must match s3_region on the Garage host ("garage", same value the
# Longhorn backup target uses).
apiVersion: config.kio.kasten.io/v1alpha1
kind: Profile
metadata:
  name: garage
  namespace: kasten-io
spec:
  type: Location
  locationSpec:
    type: ObjectStore
    credential:
      secretType: AwsAccessKey
      secret:
        apiVersion: v1
        kind: Secret
        name: k10-garage-s3
        namespace: kasten-io
    objectStore:
      objectStoreType: S3
      name: naku-kasten
      endpoint: https://garage.nakunga.com
      region: garage
      skipSSLVerify: false
