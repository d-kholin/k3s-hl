# Kasten cluster config that can't live in the Helm values: the default
# VolumeSnapshotClass for Longhorn, the Garage S3 credentials (SOPS), and
# the K10 location Profile pointing at bucket naku-kasten.
#
# Wave 2: the VolumeSnapshotClass needs the snapshot-controller CRDs
# (wave 0) and the Profile CRD is created at runtime by K10 itself
# (wave 1) — SkipDryRunOnMissingResource + retry cover first sync while K10
# boots; if retries exhaust, one manual sync finishes it (same known
# pattern as k8up-config).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasten-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/d-kholin/k3s-hl.git
    targetRevision: HEAD
    path: infrastructure/kasten-config/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kasten-io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
