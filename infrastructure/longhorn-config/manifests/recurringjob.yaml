# Tiered Longhorn → Garage S3 *block* backups for volumes in group "default"
# (every volume with no explicit recurring-job groups of its own).
#
# Local snapshot-only jobs are intentionally NOT used: they burn disk on busy
# volumes (e.g. Prometheus TSDB) and duplicate the K8up file/dump tier.
# Backup tasks still take a short-lived local snap as
# part of the upload; auto-cleanup-recurring-job-backup-snapshot removes it.
#
# Tiers (backups are incremental per volume — shared blocks stored once):
#   backup-daily    03:00 daily,        retain 7   (~1 week)
#   backup-weekly   04:30 Saturday,     retain 5   (~1 month)
#   backup-monthly  06:00 1st of month, retain 6   (~6 months)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  name: backup-daily
  task: backup
  cron: "0 3 * * *"
  groups:
    - default
  retain: 7
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  name: backup-weekly
  task: backup
  cron: "30 4 * * 6"
  groups:
    - default
  retain: 5
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-monthly
  namespace: longhorn-system
spec:
  name: backup-monthly
  task: backup
  cron: "0 6 1 * *"
  groups:
    - default
  retain: 6
  concurrency: 1
