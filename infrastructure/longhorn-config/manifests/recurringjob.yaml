# Recurring snapshots + tiered backups for all Longhorn volumes.
# Group "default" applies to every volume that has no explicit recurring-job
# groups of its own.
#
# Tiers (backups are incremental per volume — shared blocks are stored once,
# so the weekly/monthly tiers add little space):
#   snapshot-6h     local snapshots every 6h, retain 8  (~2 days of fast,
#                   in-cluster rollback points; no S3 involved)
#   backup-daily    03:00 daily,        retain 7   (~1 week)
#   backup-weekly   04:30 Saturday,     retain 5   (~1 month)
#   backup-monthly  06:00 1st of month, retain 6   (~6 months)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-6h
  namespace: longhorn-system
spec:
  name: snapshot-6h
  task: snapshot
  cron: "0 */6 * * *"
  groups:
    - default
  retain: 8
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  name: backup-daily
  task: backup
  cron: "0 3 * * *"
  groups:
    - default
  retain: 7
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  name: backup-weekly
  task: backup
  cron: "30 4 * * 6"
  groups:
    - default
  retain: 5
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-monthly
  namespace: longhorn-system
spec:
  name: backup-monthly
  task: backup
  cron: "0 6 1 * *"
  groups:
    - default
  retain: 6
  concurrency: 1
