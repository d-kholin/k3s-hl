# Root App-of-Apps for Argo CD.
# Apply once after Argo CD is up:
#   kubectl apply -f bootstrap/root-app.yaml
# Watches this repo and creates child Applications under infrastructure/ and apps/.
#
# ignoreDifferences: k8up-btl (and operators) temporarily clear
# spec.syncPolicy.automated on child Applications during PVC restore so
# selfHeal cannot fight scale-to-zero. Without this, root re-applies
# automated from git within seconds. Also ignore the restore-gui pause
# annotation so live restore state is not stripped on sync.
# Re-apply this file after edits (root is not self-managed from a path here).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/d-kholin/k3s-hl.git
      targetRevision: HEAD
      path: infrastructure
    - repoURL: https://github.com/d-kholin/k3s-hl.git
      targetRevision: HEAD
      path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .spec.syncPolicy.automated
        - '.metadata.annotations."restore-gui.local/paused-state"'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
