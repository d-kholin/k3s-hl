# App-of-Apps starter for Argo CD.
# Point this Application at this repo after bootstrap; adjust repoURL / path as needed.
# Does not point at any external application repositories.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # finalizer: resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # TODO: set to this repository's URL
    repoURL: https://github.com/EXAMPLE/k3s-hl.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
