# Root App-of-Apps for Argo CD.
# Apply once after Argo CD is up:
#   kubectl apply -f bootstrap/root-app.yaml
# Watches this repo and creates child Applications under infrastructure/ and apps/.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/d-kholin/k3s-hl.git
      targetRevision: HEAD
      path: infrastructure
    - repoURL: https://github.com/d-kholin/k3s-hl.git
      targetRevision: HEAD
      path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
